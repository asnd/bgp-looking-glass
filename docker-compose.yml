# BGP Looking Glass - Docker Compose Configuration
# Use: docker-compose up -d

services:
  looking-glass:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bgp-looking-glass
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Mount inventory file for easy updates
      - ./inventory:/app/inventory:ro
      # Optional: Mount .env file for configuration
      - ./.env:/app/.env:ro
    environment:
      - LG_DEBUG=false
      - LG_INVENTORY_PATH=/app/inventory/hosts.yml
      - LG_CONNECTION_TIMEOUT=30
      - LG_COMMAND_TIMEOUT=60
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - looking-glass-net
    # Note: For network device access, you may need host networking
    # network_mode: host

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: bgp-looking-glass-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - looking-glass
    networks:
      - looking-glass-net
    profiles:
      - production

networks:
  looking-glass-net:
    driver: bridge
