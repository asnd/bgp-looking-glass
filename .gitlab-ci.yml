# GitLab CI/CD Pipeline for BGP Looking Glass

stages:
  - lint
  - test
  - security
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
  DOCKER_IMAGE_LATEST: $CI_REGISTRY_IMAGE:latest

# Cache Python dependencies
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/pip
    - .venv/

# Base Python image
.python-base:
  image: python:3.11-slim
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt

# =============================================================================
# LINT STAGE
# =============================================================================

lint:ruff:
  extends: .python-base
  stage: lint
  script:
    - pip install ruff
    - ruff check app/ tests/
    - ruff format --check app/ tests/
  allow_failure: false

lint:mypy:
  extends: .python-base
  stage: lint
  script:
    - pip install mypy types-PyYAML
    - mypy app/ --ignore-missing-imports --no-error-summary
  allow_failure: true  # Type hints are advisory

# =============================================================================
# TEST STAGE
# =============================================================================

test:unit:
  extends: .python-base
  stage: test
  script:
    - pip install pytest pytest-cov pytest-asyncio httpx
    - pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing
  coverage: '/TOTAL.*\s+(\d+%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    when: always
    expire_in: 1 week

test:integration:
  extends: .python-base
  stage: test
  script:
    - pip install pytest pytest-asyncio httpx
    - pytest tests/test_api.py -v --tb=short
  needs:
    - test:unit

# =============================================================================
# SECURITY STAGE
# =============================================================================

security:bandit:
  extends: .python-base
  stage: security
  script:
    - pip install bandit
    - bandit -r app/ -ll -ii
  allow_failure: true

security:safety:
  extends: .python-base
  stage: security
  script:
    - pip install safety
    - safety check -r requirements.txt || true
  allow_failure: true

security:trivy:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs --security-checks vuln,config .
  allow_failure: true
  needs:
    - lint:ruff

# =============================================================================
# BUILD STAGE
# =============================================================================

build:docker:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $DOCKER_IMAGE -t $DOCKER_IMAGE_LATEST .
    - docker push $DOCKER_IMAGE
    - docker push $DOCKER_IMAGE_LATEST
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# =============================================================================
# DEPLOY STAGE (examples)
# =============================================================================

deploy:staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - echo "Deploying to staging environment..."
    # Add your deployment commands here
    # Example: kubectl set image deployment/bgp-looking-glass app=$DOCKER_IMAGE
    - echo "Deployment complete"
  environment:
    name: staging
    url: https://looking-glass-staging.example.com
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - build:docker
    - test:unit
    - test:integration

deploy:production:
  stage: deploy
  image: alpine:latest
  script:
    - echo "Deploying to production environment..."
    # Add your production deployment commands here
    - echo "Production deployment complete"
  environment:
    name: production
    url: https://looking-glass.example.com
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - build:docker
    - test:unit
    - test:integration
  when: manual  # Require manual approval for production

# =============================================================================
# MERGE REQUEST PIPELINE
# =============================================================================

# Run subset of tests on merge requests
.mr-rules:
  rules:
    - if: $CI_MERGE_REQUEST_IID

mr:lint:
  extends:
    - .python-base
    - .mr-rules
  stage: lint
  script:
    - pip install ruff
    - ruff check app/ tests/ --diff

mr:test:
  extends:
    - .python-base
    - .mr-rules
  stage: test
  script:
    - pip install pytest pytest-asyncio httpx
    - pytest tests/ -v --tb=short
