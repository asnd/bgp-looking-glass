---
# BGP Looking Glass - Ansible Inventory
# Site naming: site_<site_id>
# IP scheme: 10.74.x.y or 10.196.x.y where x is site_id
# LR1 ends with .245, LR2 ends with .246

all:
  children:
    sites:
      children:
        # Site 001 - Example Arista EOS site
        site_001:
          vars:
            site_id: "001"
            vendor: arista
            ansible_network_os: arista_eos
            ansible_user: admin
            ansible_password: "{{ vault_switch_password }}"
          hosts:
            dc1-leaf-lr1:
              ansible_host: 10.74.1.245
              role: LR1
            dc1-leaf-lr2:
              ansible_host: 10.74.1.246
              role: LR2

        # Site 002 - Example Dell OS10 site
        site_002:
          vars:
            site_id: "002"
            vendor: dell
            ansible_network_os: dell_os10
            ansible_user: admin
            ansible_password: "{{ vault_switch_password }}"
          hosts:
            dc2-leaf-lr1:
              ansible_host: 10.74.2.245
              role: LR1
            dc2-leaf-lr2:
              ansible_host: 10.74.2.246
              role: LR2

        # Site 003 - Example Juniper Junos site
        site_003:
          vars:
            site_id: "003"
            vendor: juniper
            ansible_network_os: juniper_junos
            ansible_user: admin
            ansible_password: "{{ vault_switch_password }}"
          hosts:
            dc3-leaf-lr1:
              ansible_host: 10.74.3.245
              role: LR1
            dc3-leaf-lr2:
              ansible_host: 10.74.3.246
              role: LR2

        # Site 010 - Mixed vendor example (10.196.x.y subnet)
        site_010:
          vars:
            site_id: "010"
            ansible_user: netops
            ansible_password: "{{ vault_switch_password }}"
          hosts:
            dc10-arista-lr1:
              ansible_host: 10.196.10.245
              role: LR1
              vendor: arista
            dc10-dell-lr2:
              ansible_host: 10.196.10.246
              role: LR2
              vendor: dell

        # Site 020 - Another site using 10.196.x.y subnet
        site_020:
          vars:
            site_id: "020"
            vendor: juniper
            ansible_network_os: juniper_junos
            ansible_user: admin
            ansible_password: "{{ vault_switch_password }}"
          hosts:
            dc20-qfx-lr1:
              ansible_host: 10.196.20.245
              role: LR1
            dc20-qfx-lr2:
              ansible_host: 10.196.20.246
              role: LR2
